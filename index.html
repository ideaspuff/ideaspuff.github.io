<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manuel Castellanos | Enterprise AI & Cloud Architect</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9LY7HW7CM5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9LY7HW7CM5');
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['Space Grotesk', 'monospace'],
              tech: ['Share Tech Mono', 'monospace'],
            },
            colors: {
              navy: {
                950: '#001020',
                900: '#001a33', // Primary Background
                800: '#00264d',
                700: '#003366',
              },
              cyan: {
                400: '#0DD6E8', // Electric Cyan
                500: '#00B8D4',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'scan': 'scan 4s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              scan: {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '0% 100%' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #000c1a;
        color: #ffffff;
        overflow-x: clip;
        -webkit-font-smoothing: antialiased;
      }
      /* Lenis smooth scroll */
      html.lenis, html.lenis body { height: auto; }
      .lenis.lenis-smooth { scroll-behavior: auto !important; }
      .lenis.lenis-stopped { overflow: hidden; }
      /* Custom cursor (only on fine pointers) */
      html.has-custom-cursor, html.has-custom-cursor * { cursor: none !important; }
      @keyframes scrollcue {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(200%); }
      }
      @keyframes grain {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-5%, 3%); }
        40% { transform: translate(4%, -6%); }
        60% { transform: translate(-3%, 7%); }
        80% { transform: translate(6%, -2%); }
      }
      .grain { animation: grain 0.9s steps(4) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .grain { animation: none; }
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #000c1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #003366;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0DD6E8;
      }
      
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        animation: scan 4s linear infinite;
        pointer-events: none;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
